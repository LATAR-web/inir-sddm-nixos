name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Flake check
        run: nix flake check --extra-experimental-features 'nix-command flakes'

      - name: Build ii-pixel-sddm theme
        run: nix build .#ii-pixel-sddm --extra-experimental-features 'nix-command flakes'

      - name: Build inir-sddm-sync tool
        run: nix build .#inir-sddm-sync --extra-experimental-features 'nix-command flakes'
